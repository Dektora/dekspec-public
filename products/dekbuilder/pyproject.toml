[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dekbuilder"
version = "0.129.0"
description = "Governed in-host construction consuming the installed Spec S0 boundary."
requires-python = ">=3.11"
dependencies = ["dekspec==0.129.0", "pyyaml>=6"]

[project.scripts]
dekbuilder = "dekbuilder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dekbuilder = ["py.typed", "_payload/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
