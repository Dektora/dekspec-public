[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dektools"
version = "0.129.0"
description = "Standalone craft, assessment and continuity workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
dektools = "dektools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dektools = ["_resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests/dektools_tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
